# roborak configuration. Every key is optional; the values shown are the defaults.
# Precedence: CLI flags > ROBORAK_* env vars > this file (when it is the project's
# .roborak.yaml) > ~/.config/roborak/config.yaml > built-in defaults.
version: 1

llm:
  model: anthropic/claude-sonnet-5
  # Tried in order if the primary model fails.
  fallback_models: []
  temperature: 0.2
  max_tokens: 8000
  # Prompt token ceiling. Omit to derive it from the model's context window.
  context_budget: null
  # Per-provider API keys, overriding the provider's environment variable. These
  # are real secrets: keep this file out of version control, or put them in
  # ~/.config/roborak/config.yaml instead. `roborak config show` redacts them.
  api_keys: {}
  #   anthropic: sk-ant-...
  #   openai: sk-...
  # Endpoint override for every call: an OpenAI-compatible proxy, an Azure
  # deployment, or a local Ollama. Setting it skips the missing-key check.
  api_base: null

forge:
  # Per-provider tokens for --mr/--pr/--issue, overriding GITLAB_TOKEN and
  # GITHUB_TOKEN. Real secrets, like llm.api_keys: keep this file out of version
  # control, or put them in ~/.config/roborak/config.yaml instead.
  # ROBORAK_GITLAB_TOKEN / ROBORAK_GITHUB_TOKEN still win over what is set here.
  tokens: {}
  #   gitlab: glpat-...
  #   github: ghp_...
  # Where each provider lives, for a self-hosted instance. Only used when the
  # repository's git remote does not already answer that, so a domain set here
  # never overrides a checkout whose remote points somewhere else. https is
  # assumed; give a scheme only for a plain-http instance. URL paths are not
  # supported -- pass a full URL to --mr/--pr for a one-off.
  hosts: {}
  #   gitlab: gitlab.acme.com
  #   github: http://gh.local:8080
  # Maximum forge-truncated file size to fetch when reconstructing a patch.
  max_recovered_file_bytes: 1048576

review:
  # reliability covers deployment and runtime failure in otherwise correct code --
  # mixed-version compatibility, migration sequencing, retry idempotency, flag
  # defaults, cache staleness. It is relevance-gated: a change touching none of
  # those surfaces is never asked about rollout.
  categories: [security, bug, performance, logic, reliability]
  # Findings below this are not reported.
  severity_floor: minor
  # The floor the pre-merge verdict is judged against when --fail-on is not given.
  # severity_floor decides what is reported at all; this decides what blocks.
  block_on: critical
  max_findings: 25
  # Emit exact replacement code the reviewer can commit as-is.
  committable_suggestions: true
  # Drop findings the model was not reasonably sure about.
  min_confidence: 0.5
  # Require a critical or major model finding to name what makes it true -- the
  # trigger and failure path, the violated contract, a reproduction, or a tool
  # result. One that cannot is demoted to a minor `verification_needed` instead of
  # blocking the merge. Static-analyser findings are exempt: a tool ran.
  require_evidence: true
  # Allow findings on lines this change did not touch. Off by default: untouched
  # code is not what the author asked about, and it is the main source of noise.
  full_file: false
  # With --issue, let the model report requirements the change does not implement,
  # as findings of kind `requirement_gap`. Ignored without --issue.
  check_requirements: true
  # Include unresolved human MR/PR discussion as bounded, untrusted model context.
  include_discussions: true
  # Bounded, read-only repository lookups that settle a candidate finding before
  # require_evidence judges it: the model asks for a line range, a search or the
  # diff, and then confirms, revises or drops the candidate. It cannot run
  # commands, write files or reach the network, and a candidate it cannot settle
  # is left exactly as it was. Costs one model call on a review that has a
  # critical, major or would-be-demoted finding, and nothing on one that does not.
  # --no-investigate switches it off.
  investigate:
    enabled: true
    # Findings put to the stage, worst first.
    max_candidates: 5
    # Request/result exchanges before the model must decide.
    max_rounds: 2
    max_requests_per_round: 4
    # Distinct files the whole investigation may open.
    max_files: 10
    max_lines_per_read: 200
    max_search_results: 20
    # Ceiling on one operation's result. What does not fit is marked truncated.
    max_output_chars: 4000
    # Prompt tokens the gathered evidence may occupy before the stage must decide.
    token_budget: 20000
    # Wall clock for the repository operations, not for the model calls.
    timeout_seconds: 30

static:
  enabled: true
  # auto runs directly for local work and sandboxed in CI; trusted explicitly
  # allows direct CI execution; off disables static tools.
  execution: auto
  # null autodetects whatever is on PATH.
  tools: null
  timeout_seconds: 90
  # Pass static findings to the model as evidence rather than reporting them raw.
  feed_to_llm: true

supply_chain:
  # Read the manifest and lockfile pairs a change touched and reduce them to a
  # small semantic delta: packages added, removed, upgraded, resolved from a
  # different source, or no longer covered by a checksum. The lockfiles
  # themselves stay excluded from the model's context by `ignore_paths` -- this
  # is what replaces them. Supported: npm/yarn/pnpm, Python (uv, poetry, pdm,
  # requirements), Go, Cargo and Composer. Changes to CI workflows, Dockerfiles
  # and Terraform additionally turn on targeted review checklists for them.
  enabled: true
  # Dependency movements carried into the report. Source, integrity and drift
  # changes sort first, so a lockfile regeneration truncates version bumps.
  max_changes: 40
  # Manifest, lock and infrastructure files parsed per review.
  max_assets: 20
  timeout_seconds: 10
  feed_to_llm: true
  # Prompt tokens the dependency section may occupy, reserved out of the diff
  # budget so it can never squeeze out a changed file.
  token_budget: 1200

impact:
  # Work outward from the symbols and contracts the change touched to the
  # unchanged code that depends on them, and show the model what it found. Every
  # number below is a ceiling: what the search cannot finish is reported as
  # truncated rather than passed off as "nothing uses this".
  enabled: true
  # Changed symbols, exports, routes, events, config keys and env vars traced per
  # review. Parser-identified symbols get the budget before pattern-matched ones.
  max_nodes: 12
  max_consumers_per_node: 5
  # Ceiling on the fallback walk, used when `git grep` is unavailable.
  max_files_scanned: 2000
  max_snippet_lines: 6
  # Prompt tokens the consumer snippets may occupy, reserved out of the diff
  # budget up front so the map can never squeeze out a changed file.
  token_budget: 1500
  timeout_seconds: 10
  # A merge or pull request is a diff; finding its unchanged consumers needs a
  # tree. When the reviewed head commit is not in this repository, auto fetches
  # it into a temporary checkout, searches that and deletes it. This is the only
  # part of a review that reaches the network for repository content; off leaves
  # the blast radius unavailable instead, as it was before. ROBORAK_IMPACT_FORGE_CHECKOUT
  # sets the same thing from the environment, for CI that cannot edit this file.
  forge_checkout: auto
  # Wall clock for that fetch, separate from the local search above. It bounds the
  # whole attempt -- fetch, fallback ref and checkout -- not each git command.
  forge_checkout_timeout_seconds: 60

output:
  # Spend a second model call on an overview of the change. It is what fills the
  # summary comment `--post` publishes; turn it off to halve the cost of a run.
  # Re-posting to a merge request whose files and hunks have not moved reuses the
  # overview already published there instead of paying for it twice.
  walkthrough: true
  # At the end of an interactive review, offer to publish the result. Only ever
  # asked on a terminal -- a script or a CI job is never prompted.
  confirm_post: true
  # When publishing, also set a `roborak/review` commit status on the change's head
  # commit, so branch protection or approval rules can gate on the verdict.
  post_check: true
  # Print rich panels instead of the report -- one finding to a bordered panel.
  # Neither is what gets published; the report is.
  panels: false
  # Show what the terminal report leaves out: the agent prompt under each finding
  # and the review-info tree. Both are written for a machine to read.
  full: false

ignore_paths:
  - "**/*.lock"
  - "**/*.min.js"
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/dist/**"

rules_dir: .roborak/rules

# Extra prompt guidance per language, for stack-specific conventions.
language_instructions: {}
  # php: "Laravel 10 with the repository pattern; controllers stay thin."
