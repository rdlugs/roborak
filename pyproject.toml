[project]
name = "roborak"
version = "0.1.0"
description = "AI code review from the terminal — local diffs, GitLab MRs, and GitHub PRs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "litellm>=1.60",
    "jinja2>=3.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # litellm imports tenacity for its num_retries path but does not declare it
    "tenacity>=9.0",
]

[project.optional-dependencies]
ast = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[project.scripts]
roborak = "roborak.cli.main:app"
rk = "roborak.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["B008"]  # typer uses function calls in defaults
# The report badges are emoji; ℹ and ⚠ are the characters GitHub renders, not typos.
allowed-confusables = ["ℹ", "⚠", "→", "·"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
