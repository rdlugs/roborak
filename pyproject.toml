[project]
name = "roborak"
version = "0.7.0"
description = "AI code review from the terminal - local diffs, GitLab MRs, and GitHub PRs."
readme = "README.md"
keywords = ["code-review", "llm", "gitlab", "github", "static-analysis", "cli"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
# Declared rather than implied: CI runs every one of these, on every one of
# those, so the claim is a test result. No License:: entry -- PyPI rejects one
# alongside the SPDX expression above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "litellm>=1.60",
    "jinja2>=3.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "packaging>=24.0",
    # arrow-key selection in `rk setup`; rich.prompt cannot do lists
    "questionary>=2.0",
    # litellm imports tenacity for its num_retries path but does not declare it
    "tenacity>=9.0",
    # the parser behind both AST passes: ast_context looks inward from a hunk to
    # the symbol containing it, impact looks outward to what depends on it
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[project.urls]
Homepage = "https://github.com/rdlugs/roborak"
Documentation = "https://roborak.pages.dev"
Source = "https://github.com/rdlugs/roborak"
Issues = "https://github.com/rdlugs/roborak/issues"
Changelog = "https://github.com/rdlugs/roborak/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[project.scripts]
roborak = "roborak.cli.main:app"
rk = "roborak.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["B008"]  # typer uses function calls in defaults
# The report badges are emoji; ℹ and ⚠ are the characters GitHub renders, not typos.
allowed-confusables = ["ℹ", "⚠", "→", "·"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
