name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run it interrupts, but let main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows is not green yet: the static runner hardcodes POSIX paths and
    # adapter discovery assumes .venv/bin. Report it without blocking PRs, and
    # drop this once those are fixed.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Report every leg; one failing tells you nothing about the others.
      fail-fast: false
      matrix:
        # Every interpreter we claim to support, on Linux.
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # The other platforms get one leg each, on the newest interpreter.
          - os: macos-latest
            python: "3.14"
            experimental: false
          - os: windows-latest
            python: "3.14"
            experimental: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests evals

      - name: Check formatting
        run: uv run ruff format --check src tests evals

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src/roborak --cov-fail-under=90

      - name: Build the package
        run: uv build

      - name: Smoke-test the CLI
        run: uv run roborak --help
