name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run it interrupts, but let main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report every leg; one failing tells you nothing about the others.
      fail-fast: false
      matrix:
        # Every interpreter we claim to support, on every OS we claim to run on.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src tests evals .github/scripts

      - name: Check formatting
        run: uv run ruff format --check src tests evals .github/scripts

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src/roborak --cov-fail-under=90

      - name: Build the package
        run: uv build

      # The parser is a required dependency now, and only the wheel's own metadata
      # can prove a plain `pip install roborak` still gets one.
      - name: Check the wheel ships AST support by default
        run: uv run --no-project python .github/scripts/check_wheel.py

      - name: Smoke-test the CLI
        run: uv run roborak --help

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The build is the deploy: if this fails, Cloudflare Pages would fail too.
      - name: Build the static site
        run: npm run build

      # A build that dropped a page still succeeds, so check the copy people
      # actually read made it into the bundle.
      - name: Check the build carries its content
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          grep -rq "AI code review" dist/assets/
          grep -rq "uvx roborak" dist/assets/
