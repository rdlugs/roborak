name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  quality:
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src tests evals
      - run: uv run ruff format --check src tests evals
      - run: uv run mypy src
      - run: uv run pytest --cov=src/roborak --cov-fail-under=90
      - run: uv build
      - run: uv run roborak --help

  live-eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ROBORAK_EVAL_MODEL: ${{ vars.ROBORAK_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - if: env.ANTHROPIC_API_KEY != ''
        run: uv run python evals/run.py --output eval-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-eval
          path: eval-results.json
          if-no-files-found: ignore
