name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run it interrupts, but let main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report both interpreters; one failing tells you nothing about the other.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests evals

      - name: Check formatting
        run: uv run ruff format --check src tests evals

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src/roborak --cov-fail-under=90

      - name: Build the package
        run: uv build

      - name: Smoke-test the CLI
        run: uv run roborak --help
